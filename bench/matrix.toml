# ============ Probes, round 2 (2026-10-18): one run each ============
# tuned = firm docs guidance + bash timeout, no pi-lens; models capped at 4K thinking.
# H4: tuned Qwen3.6 (fast MoE). H6: finish-line check on Qwen3.8.
