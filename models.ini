; llama.cpp router presets (start-llama-router.sh passes this via --models-preset).
; Keys are llama-server flags without the leading dashes. Command-line flags
; override everything here, so per-model settings (like `c`) must live here,
; not in the start script.
;
; Sections named exactly like a file in $MODELS_DIR set that model's defaults
; (these are what you get in pi day to day). Sections with other names are
; extra variants of the same file, mainly for benchmarking; they show up in
; pi's /llama list too. Name variants with dashes, not colons: llama.cpp reads
; "name:x" as a Hugging Face quant tag and mangles it. A variant's
; `model = <file>.gguf` (and `model-draft`) names a file relative to $MODELS_DIR;
; start-llama-router.sh expands it to an absolute path.
; See MODEL-SETTINGS.md for where the values come from.
;
; Restart the router after editing.

version = 1

[*]
c = 65536
ctx-checkpoints = 32
checkpoint-min-step = 0

; ---------------------------------------------------------------- Qwen3.6-35B-A3B
; Default: Qwen's "thinking mode, precise coding" recommendation.
[Qwen3.6-35B-A3B-UD-Q6_K_XL]
c = 131072
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0

; Qwen's "thinking mode, general tasks" recommendation.
[qwen3.6-35b-general]
model = Qwen3.6-35B-A3B-UD-Q6_K_XL.gguf
c = 131072
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5

; Control: no tuning. GGUF-embedded sampling
; (temp 1.0 / top-k 20 / top-p 0.95) + llama.cpp's min-p 0.05, 64K context.
[qwen3.6-35b-baseline]
model = Qwen3.6-35B-A3B-UD-Q6_K_XL.gguf
c = 65536
min-p = 0.05

; --------------------------------------------------------------- Qwen3.8-27B
; Dense (all 27B params per token), so ~3x slower than Qwen3.6-35B-A3B.
; Qwen card, thinking mode (its only coding recommendation).
[Qwen3.8-27B-UD-Q6_K_XL]
c = 131072
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0

; ----------------------------------------------------------- Gemma 4 26B-A4B-it
; Google: same sampling for all use cases.
[gemma-4-26B-A4B-it-UD-Q6_K_XL]
c = 131072
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

; ------------------------------------------------------------- Qwen3-Coder-Next
; Non-thinking only. ~38GB weights: unload other models first.
[Qwen3-Coder-Next-UD-IQ4_XS]
c = 131072
temp = 1.0
top-p = 0.95
top-k = 40
min-p = 0.0

; Same, at Qwen3.6's coding temperature, to separate model from sampling effects.
[qwen3-coder-next-t0.6]
model = Qwen3-Coder-Next-UD-IQ4_XS.gguf
c = 131072
temp = 0.6
top-p = 0.95
top-k = 40
min-p = 0.0

; Qwen3.8-27B with thinking capped per response. Without a cap it can spend a
; whole 45-minute turn designing and "mentally debugging" a program without ever
; calling a tool (seen on the Tetris task). When the budget runs out, llama.cpp
; injects the message and closes the thinking block, so the model has to act.
[qwen3.8-27b-budget]
model = Qwen3.8-27B-UD-Q6_K_XL.gguf
c = 131072
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
reasoning-budget = 8192
reasoning-budget-message = Okay, I've planned enough. Time to stop thinking and start working with my tools.

; Qwen3.8-27B for thinking-off use: Qwen's "instruct (non-thinking) mode" sampling.
[qwen3.8-27b-instruct]
model = Qwen3.8-27B-UD-Q6_K_XL.gguf
c = 131072
temp = 0.7
top-p = 0.80
top-k = 20
min-p = 0.0
presence-penalty = 1.5

; Same as qwen3.8-27b-budget with a tighter cap: at ~22 tok/s, 8K tokens of
; thinking is ~6 minutes before the model acts. Probe H1 (2026-10-18).
[qwen3.8-27b-budget4k]
model = Qwen3.8-27B-UD-Q6_K_XL.gguf
c = 131072
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
reasoning-budget = 4096
reasoning-budget-message = Okay, I've planned enough. Time to stop thinking and start working with my tools.

; Qwen3.6-35B-A3B coding preset with a 4K thinking cap (probe H4: does the tuned
; environment rescue the fast model?).
[qwen3.6-35b-budget4k]
model = Qwen3.6-35B-A3B-UD-Q6_K_XL.gguf
c = 131072
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
reasoning-budget = 4096
reasoning-budget-message = Okay, I've planned enough. Time to stop thinking and start working with my tools.

; qwen3.8-27b-budget4k plus MTP speculative decoding (probe H5): Qwen3.8's
; multi-token-prediction head drafts tokens that the main model verifies in one
; pass. Same output distribution, about 2x faster. The MTP file lives outside
; $MODELS_DIR (in a sibling models-aux/) so the router doesn't list it as a chat model.
[qwen3.8-27b-budget4k-mtp]
model = Qwen3.8-27B-UD-Q6_K_XL.gguf
c = 131072
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
reasoning-budget = 4096
reasoning-budget-message = Okay, I've planned enough. Time to stop thinking and start working with my tools.
spec-type = draft-mtp
model-draft = ../models-aux/mtp-Qwen3.8-27B-Q4_0.gguf
gpu-layers-draft = 999
; Everyday default (2026-10-18): loaded when the router starts.
load-on-startup = true
