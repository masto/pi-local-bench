# Benchmark matrix: each [[run]] is one configuration, executed `repeats` times.
# `model` is a model id from the llama.cpp router (a file in $MODELS_DIR or a
# section in ../models.ini). `thinking` is pi's --thinking level; llama.cpp
# models only distinguish "off" and "medium" (anything else is clamped).

[defaults]
task = "astro-blog"
repeats = 2
timeout_min = 30
thinking = "medium"
profile = "minimal"   # or "batteries": web search, browser, diagnostics, tasks (see bench.py PROFILES)
provider = "local"    # or "clinepass" (model ids like "cline-pass/kimi-k3"; see `pi --list-models clinepass`)

# --- Qwen3.6-35B-A3B: sampling presets
[[run]]
name = "qwen3.6 baseline"   # control: GGUF defaults, 64K context
model = "qwen3.6-35b-baseline"

[[run]]
name = "qwen3.6 coding"     # Qwen's coding recommendation (daily default)
model = "Qwen3.6-35B-A3B-UD-Q6_K_XL"

[[run]]
name = "qwen3.6 general"
model = "qwen3.6-35b-general"

[[run]]
name = "qwen3.6 coding, no thinking"
model = "Qwen3.6-35B-A3B-UD-Q6_K_XL"
thinking = "off"

# --- Qwen3.8-27B (dense, so slower: longer timeout)
[[run]]
name = "qwen3.8-27b"
model = "Qwen3.8-27B-UD-Q6_K_XL"
timeout_min = 45

# --- Gemma 4 26B-A4B
[[run]]
name = "gemma4"
model = "gemma-4-26B-A4B-it-UD-Q6_K_XL"

[[run]]
name = "gemma4, no thinking"
model = "gemma-4-26B-A4B-it-UD-Q6_K_XL"
thinking = "off"

# --- Qwen3-Coder-Next (non-thinking model)
[[run]]
name = "coder-next"
model = "Qwen3-Coder-Next-UD-IQ4_XS"
thinking = "off"

[[run]]
name = "coder-next t0.6"
model = "qwen3-coder-next-t0.6"
thinking = "off"

# ============ Batteries profile: same task and scoring, Claude-Code-like tools ============
# Run just these with: ./bench.py run --only batteries

[[run]]
name = "qwen3.6 coding +batteries"
model = "Qwen3.6-35B-A3B-UD-Q6_K_XL"
profile = "batteries"

[[run]]
name = "qwen3.6 general +batteries"
model = "qwen3.6-35b-general"
profile = "batteries"

[[run]]
name = "qwen3.8-27b +batteries"
model = "Qwen3.8-27B-UD-Q6_K_XL"
profile = "batteries"
timeout_min = 45

[[run]]
name = "gemma4 +batteries"
model = "gemma-4-26B-A4B-it-UD-Q6_K_XL"
profile = "batteries"

[[run]]
name = "coder-next t0.6 +batteries"
model = "qwen3-coder-next-t0.6"
thinking = "off"
profile = "batteries"

# ============ ClinePass cloud models: same task and scoring, both profiles ============
# Run just these with: ./bench.py run --only clinepass   (needs a ClinePass account; uses its quota)

[[run]]
name = "kimi-k3 (clinepass)"
provider = "clinepass"
model = "cline-pass/kimi-k3"

[[run]]
name = "kimi-k3 (clinepass) +batteries"
provider = "clinepass"
model = "cline-pass/kimi-k3"
profile = "batteries"

[[run]]
name = "glm-5.3 (clinepass)"
provider = "clinepass"
model = "cline-pass/glm-5.3"

[[run]]
name = "glm-5.3 (clinepass) +batteries"
provider = "clinepass"
model = "cline-pass/glm-5.3"
profile = "batteries"

[[run]]
name = "deepseek-v4-pro (clinepass)"
provider = "clinepass"
model = "cline-pass/deepseek-v4-pro"

[[run]]
name = "deepseek-v4-pro (clinepass) +batteries"
provider = "clinepass"
model = "cline-pass/deepseek-v4-pro"
profile = "batteries"

[[run]]
name = "qwen3.8-max (clinepass)"
provider = "clinepass"
model = "cline-pass/qwen3.8-max"

[[run]]
name = "qwen3.8-max (clinepass) +batteries"
provider = "clinepass"
model = "cline-pass/qwen3.8-max"
profile = "batteries"

# ============ Environment tuning: Qwen3.8-27B (2026-10-18) ============
# batteries now has pi-lens working (project trust fix); batteries+agents adds
# profiles/guidance.md as APPEND_SYSTEM.md. Run with: ./bench.py run --only "qwen3.8-27b ·"
# Earlier results are archived in archive/2026-10-17-model-survey/ (open its gallery.html).

[[run]]
name = "qwen3.8-27b · minimal · astro"
model = "Qwen3.8-27B-UD-Q6_K_XL"
repeats = 3
timeout_min = 45

[[run]]
name = "qwen3.8-27b · batteries · astro"
model = "Qwen3.8-27B-UD-Q6_K_XL"
profile = "batteries"
repeats = 3
timeout_min = 45

[[run]]
name = "qwen3.8-27b · batteries+agents · astro"
model = "Qwen3.8-27B-UD-Q6_K_XL"
profile = "batteries+agents"
repeats = 3
timeout_min = 45

[[run]]
name = "qwen3.8-27b · minimal · tetris"
model = "Qwen3.8-27B-UD-Q6_K_XL"
task = "tetris"
repeats = 3
timeout_min = 45

[[run]]
name = "qwen3.8-27b · batteries · tetris"
model = "Qwen3.8-27B-UD-Q6_K_XL"
task = "tetris"
profile = "batteries"
repeats = 3
timeout_min = 45

[[run]]
name = "qwen3.8-27b · batteries+agents · tetris"
model = "Qwen3.8-27B-UD-Q6_K_XL"
task = "tetris"
profile = "batteries+agents"
repeats = 3
