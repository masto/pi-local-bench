# ============ Probe: thinking control on Tetris (2026-10-18) ============
# Uncapped Qwen3.8 thinking spent whole runs planning without a tool call.
# Run with: ./bench.py run --only "think-budget,no-think"

[[run]]
name = "qwen3.8-27b · batteries+agents · tetris · think-budget-8k"
model = "qwen3.8-27b-budget"
task = "tetris"
profile = "batteries+agents"
repeats = 1
timeout_min = 45

[[run]]
name = "qwen3.8-27b · batteries+agents · tetris · no-think"
model = "qwen3.8-27b-instruct"
task = "tetris"
profile = "batteries+agents"
thinking = "off"
repeats = 1
timeout_min = 45

